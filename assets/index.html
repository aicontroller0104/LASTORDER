<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>LAST ORDER</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07090a;color:#e7e4da;font-family:system-ui,sans-serif}button{font:inherit;color:#eee;background:#202521;border:1px solid #596157;border-radius:8px;padding:7px 4px}#app{height:100%;display:flex;flex-direction:column;background:radial-gradient(circle at 50% 20%,#303a35,#111613 45%,#07090a)}#top{height:70px;padding:8px 10px;border-bottom:1px solid #4b554c;background:#070a0aee;display:flex;align-items:center;justify-content:space-between}.title{font-weight:900;letter-spacing:2px;font-size:19px}.sub{font-size:9px;color:#a9b0a7}.badge{font-size:9px;padding:6px;border:1px solid #6e756c;border-radius:20px}#battle{position:relative;flex:1;overflow:hidden}#field{position:absolute;inset:0;background:linear-gradient(180deg,#39453d,#1b251f 48%,#101612),repeating-linear-gradient(90deg,#ffffff06 0 1px,transparent 1px 48px)}#field:after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse,transparent 25%,#000a 90%)}#road{position:absolute;left:45%;top:0;width:17%;height:100%;background:#8a846d18;transform:skewX(-9deg)}#tower{position:absolute;right:12%;top:18%;width:38px;height:100px;border:4px solid #59645a;border-bottom:8px solid #424b43;opacity:.7}#hud{position:absolute;top:10px;left:10px;right:10px;z-index:5}.panel{background:#070a09dd;border:1px solid #566057;border-radius:9px;padding:8px}.row{display:flex;gap:7px;align-items:center}.grow{flex:1}.small{font-size:10px;color:#bfc5bd}.bar{height:7px;background:#242a25;border-radius:5px;overflow:hidden}.fill{height:100%;background:#b5c0a8}.unit{position:absolute;width:34px;height:34px;border-radius:50%;border:2px solid #bbc3b8;background:#2d372f;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;z-index:2}.player{border-color:#e5dfbd!important;box-shadow:0 0 16px #ddd4a644}#bottom{background:#060808f7;border-top:1px solid #4d564e;padding:6px;z-index:10}#members{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}.member{min-height:58px;font-size:9px;padding:4px;overflow:hidden}.member.active{outline:2px solid #ddd7b5}.member b{display:block;font-size:10px}.member span{color:#aab0a9}#commands{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:5px}#commands button{font-size:10px;padding:7px 2px}#message{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);z-index:20;background:#000d;border:1px solid #777f76;padding:8px 12px;border-radius:20px;font-size:11px;white-space:nowrap;display:none}#switchHint{text-align:center;font-size:8px;color:#8f978f;margin-top:3px}
</style></head><body><div id="app"><header id="top"><div><div class="title">LAST ORDER</div><div class="sub">TWO SIDES OF WAR · MOBILE PROTOTYPE</div></div><div class="badge">WEST FRONT · 06:40</div></header><section id="battle"><div id="field"><div id="road"></div><div id="tower"></div></div><div id="hud"><div class="panel"><div class="row"><b id="role">★ SQUAD LEADER</b><span class="grow"></span><span class="small">5-MAN SQUAD</span></div><div class="row" style="margin-top:4px"><span class="small">HP</span><div class="bar grow"><div id="hpbar" class="fill" style="width:100%"></div></div><span id="hptext" class="small">100%</span></div><div class="row" style="margin-top:4px"><span class="small">MORALE <b id="morale">80</b></span><span class="small">TRUST <b id="trust">80</b></span><span class="grow"></span><span id="order" class="small">READY</span></div></div></div><div id="message"></div></section><footer id="bottom"><div id="members"></div><div id="commands"></div><div id="switchHint">캐릭터를 누르면 직접 조종 · ★ 리더만 분대 명령 가능</div></footer></div><script>
const members=[{name:"SQUAD LEADER",cls:"Rifleman",icon:"★",hp:100,morale:80,trust:80,x:22,y:58},{name:"RIFLEMAN",cls:"Rifleman",icon:"②",hp:100,morale:80,trust:80,x:31,y:65},{name:"MACHINE GUNNER",cls:"Machine Gunner",icon:"③",hp:100,morale:80,trust:80,x:40,y:58},{name:"MEDIC",cls:"Medic",icon:"④",hp:100,morale:80,trust:80,x:31,y:48},{name:"ENGINEER",cls:"Engineer",icon:"⑤",hp:100,morale:80,trust:80,x:22,y:46}];let active=0,order="READY",timer=0;const common=["Move","Attack","Defend","Wait","Recon","Retreat","Regroup","Support"],classCmd={Rifleman:"Cover Fire","Machine Gunner":"Suppression Fire",Medic:"Emergency Treatment",Engineer:"Fortification"};function msg(t){const e=document.getElementById("message");e.textContent=t;e.style.display="block";clearTimeout(msg.t);msg.t=setTimeout(()=>e.style.display="none",1800)}function draw(){document.querySelectorAll(".unit").forEach(e=>e.remove());members.forEach((m,i)=>{const e=document.createElement("div");e.className="unit "+(i===active?"player":"");e.textContent=m.icon;e.style.left=m.x+"%";e.style.top=m.y+"%";document.getElementById("battle").appendChild(e)})}function render(){const m=members[active];document.getElementById("role").textContent=(active===0?"★ ":"")+m.cls.toUpperCase();document.getElementById("hpbar").style.width=Math.max(0,m.hp)+"%";document.getElementById("hptext").textContent=Math.round(m.hp)+"%";document.getElementById("morale").textContent=Math.round(m.morale);document.getElementById("trust").textContent=Math.round(m.trust);document.getElementById("order").textContent=order.toUpperCase();const mm=document.getElementById("members");mm.innerHTML="";members.forEach((u,i)=>{const b=document.createElement("button");b.className="member"+(i===active?" active":"");b.innerHTML="<b>"+u.icon+" "+u.name+"</b><span>"+u.cls+" · HP "+Math.round(u.hp)+"%</span>";b.onclick=()=>{active=i;render();msg(i===0?"분대장으로 전환":"직접 조종: "+u.cls)};mm.appendChild(b)});const cc=document.getElementById("commands");cc.innerHTML="";common.forEach(c=>{const b=document.createElement("button");b.textContent=c;b.onclick=()=>command(c);cc.appendChild(b)});const b=document.createElement("button");b.textContent=classCmd[m.cls]||"Class Action";b.onclick=classAction;cc.appendChild(b);draw()}function command(c){if(active!==0){msg("명령권한 없음 — ★ 분대장으로 전환하세요");return}const avg=members.reduce((s,m)=>s+(m.morale+m.trust)/2,0)/members.length;let refusal=100-Math.min(95,50+avg*.45);const low=members.some(m=>m.hp<20);if(c==="Attack"&&low)refusal=5+(100-avg)*.75;if(c==="Attack"&&low&&Math.random()*100<refusal){order="Retreat";members.forEach(m=>m.morale=Math.max(0,m.morale-1));render();msg("사기/신뢰 판단: 공격 거부 → 후퇴");return}order=c;render();msg("분대 명령 실행: "+c)}function classAction(){const m=members[active];order=classCmd[m.cls]||"ACTION";render();msg(m.cls+" 행동: "+order)}function tick(){timer++;members.forEach((m,i)=>{if(i!==active&&order==="Attack"&&Math.random()<.08)m.hp=Math.max(1,m.hp-1);if(order==="Retreat")m.hp=Math.min(100,m.hp+.15);if(order==="Emergency Treatment")m.hp=Math.min(100,m.hp+1)});if(timer%12===0&&members.some(m=>m.hp<20))msg("경고: 저체력 병력 감지");render()}render();setInterval(tick,1000);
</script></body></html>
